# Front door for Emby on host port 8096.
#
# Requests carrying a SearchTerm query arg go to searchfix (the re-ranker), and
# so do home rows (/Sections/{id}/Items) and the numbered top-list posters they
# point at (tag=hsc..., see searchfix/toplist.py); everything else (streams,
# websockets, other images, API) goes straight to Emby.
# If searchfix is down or errors at the connection level, the request is
# retried directly against Emby, so search degrades to Emby's own ordering
# instead of failing.

# Docker's embedded DNS. `resolve` re-looks-up the container names every
# `valid` seconds, so a recreated emby/searchfix container with a new IP is
# picked up without restarting nginx (otherwise nginx pins the IP it saw at
# startup and Emby goes dark after e.g. an image update).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream emby_up {
    zone emby_up 64k;
    server emby:8096 resolve;
    keepalive 32;
}
upstream searchfix_up {
    zone searchfix_up 64k;
    server searchfix:8080 resolve;
    keepalive 8;
}

# $arg_ lookups are case-insensitive, so SearchTerm/searchTerm and tag/Tag match.
# Key: "<tag>|<SearchTerm>|<path>"; the first matching regex wins.
map "$arg_tag|$arg_searchterm|$uri" $emby_backend {
    "~^hsc"                                       searchfix_up;   # numbered top-list poster
    "~*^[^|]*\|[^|]*\|.*/Sections/[^/]+/Items$"   searchfix_up;   # home row
    "~^[^|]*\|\|"                                 emby_up;        # no SearchTerm
    default                                       searchfix_up;   # search
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    # TCP keepalive toward clients: same idea as the socat relay fix
    # (gotchas.md, 2026-07-23) so idle NAT entries don't go stale mid-stream.
    listen 8096 so_keepalive=30s:10s:4;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    # Long-lived direct play / websockets. send_timeout matters most: a paused
    # client with a full buffer stops reading, and nginx's 60s default would
    # cut the stream.
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: Emby is set to trust this header, so a
    # client-supplied value must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://$emby_backend;
        error_page 502 504 = @emby_direct;
    }

    location @emby_direct {
        proxy_pass http://emby_up;
    }

    access_log off;
}
