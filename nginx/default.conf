# Front door for Emby on host port 8096.
#
# Requests carrying a SearchTerm query arg go to searchfix (the re-ranker), and
# so do home rows (/Sections/{id}/Items), the numbered top-list posters they
# point at (tag=hsc...) and single items (/Users/{id}/Items/{id}, where HSC's
# copy is hidden as a version; see searchfix/toplist.py); everything else (streams,
# websockets, other images, API) goes straight to Emby.
# If searchfix is down or errors at the connection level, the request is
# retried directly against Emby, so search degrades to Emby's own ordering
# instead of failing.

# Docker's embedded DNS. `resolve` re-looks-up the container names every
# `valid` seconds, so a recreated emby/searchfix container with a new IP is
# picked up without restarting nginx (otherwise nginx pins the IP it saw at
# startup and Emby goes dark after e.g. an image update).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream emby_up {
    zone emby_up 64k;
    server emby:8096 resolve;
    keepalive 32;
}
upstream searchfix_up {
    zone searchfix_up 64k;
    server searchfix:8080 resolve;
    keepalive 8;
}

# $arg_ lookups are case-insensitive, so SearchTerm/searchTerm and tag/Tag match.
# Key: "<tag>|<SearchTerm>|<path>"; the first matching regex wins.
map "$arg_tag|$arg_searchterm|$uri" $emby_backend {
    "~^hsc"                                       searchfix_up;   # numbered top-list poster (rows cached by apps before the rollback)
    "~*^[^|]*\|[^|]*\|.*/Users/[^/]+/Items/[0-9]+$" searchfix_up;   # one item (hide HSC copy version)
    "~^[^|]*\|\|"                                 emby_up;        # no SearchTerm
    default                                       searchfix_up;   # search
}

# ---- Request log (API browsing only; no streams, images or static files) ----
# One file per day, /var/log/emby-requests/req-YYYY-MM-DD.log (host: ~/docker/emby/request-logs).
# Kept 14 days by a host cron. Access tokens are redacted from the URL and the
# X-Emby-Authorization header is never logged (only its Client/Device fields).
map $time_iso8601 $reqlog_date {
    "~^(?<d>\d{4}-\d{2}-\d{2})" $d;
    default                     "unknown";
}
map $uri $reqlog_on_uri {
    "~*/(videos|audio|hls|hls1|livetv/livestreamfiles)/" 0;
    "~*/images/"                                          0;
    "~*/embywebsocket|/socket"                            0;
    "~*/sessions/playing"                                 0;
    "~*/system/ping$"                                     0;
    "~*^/(web|emby/web)/"                                 0;
    "~*favicon"                                           0;
    default                                               1;
}
# Also skip requests with no request line (a periodic empty connection that nginx answers 400).
map "$reqlog_on_uri:$request_method" $reqlog_on {
    "~^1:."  1;
    default  0;
}
# Redact up to 3 token-like query args (one per map; lookahead skips ones already done).
map $request_uri $reqlog_uri1 {
    "~*^(?<p>.*?[?&](?:api_key|x-emby-token|x-mediabrowser-token|accesstoken|token)=)(?!REDACTED)[^&]*(?<q>.*)$" "${p}REDACTED${q}";
    default $request_uri;
}
map $reqlog_uri1 $reqlog_uri2 {
    "~*^(?<p>.*?[?&](?:api_key|x-emby-token|x-mediabrowser-token|accesstoken|token)=)(?!REDACTED)[^&]*(?<q>.*)$" "${p}REDACTED${q}";
    default $reqlog_uri1;
}
map $reqlog_uri2 $reqlog_uri {
    "~*^(?<p>.*?[?&](?:api_key|x-emby-token|x-mediabrowser-token|accesstoken|token)=)(?!REDACTED)[^&]*(?<q>.*)$" "${p}REDACTED${q}";
    default $reqlog_uri2;
}
# App and device: from the X-Emby-Authorization header, else from the X-Emby-Client /
# X-Emby-Device-Name query args that most Emby apps send instead (URL-encoded as sent).
map $http_x_emby_authorization $reqlog_hclient {
    "~*Client=\"(?<c>[^\"]*)\"" $c;
    default "";
}
map $http_x_emby_authorization $reqlog_hdevice {
    "~*Device=\"(?<d>[^\"]*)\"" $d;
    default "";
}
map $args $reqlog_qclient {
    "~*(?:^|&)x-emby-client=(?<c>[^&]*)" $c;
    default "-";
}
map $args $reqlog_qdevice {
    "~*(?:^|&)x-emby-device-name=(?<d>[^&]*)" $d;
    default "-";
}
map "$reqlog_hclient|$reqlog_qclient" $reqlog_client {
    "~^\|(?<q>.*)$"   $q;
    "~^(?<h>[^|]+)\|" $h;
}
map "$reqlog_hdevice|$reqlog_qdevice" $reqlog_device {
    "~^\|(?<q>.*)$"   $q;
    "~^(?<h>[^|]+)\|" $h;
}
log_format emby_req escape=json '$time_iso8601\t$remote_addr\t$reqlog_client\t$reqlog_device\t'
                                '$request_method\t$reqlog_uri\t$status\t$body_bytes_sent\t'
                                '$request_time\t$emby_backend\t"$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    # TCP keepalive toward clients: same idea as the socat relay fix
    # (gotchas.md, 2026-07-23) so idle NAT entries don't go stale mid-stream.
    listen 8096 so_keepalive=30s:10s:4;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    # Long-lived direct play / websockets. send_timeout matters most: a paused
    # client with a full buffer stops reading, and nginx's 60s default would
    # cut the stream.
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: Emby is set to trust this header, so a
    # client-supplied value must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://$emby_backend;
        error_page 502 504 = @emby_direct;
    }

    # PlaybackInfo (play start; also Emby Web's Version list): searchfix drops HSC's
    # copy from the versions. The body (device profile) is buffered here so that if
    # searchfix is down, @emby_direct can still send it to Emby.
    location ~* /Items/[0-9]+/PlaybackInfo$ {
        proxy_request_buffering on;
        proxy_pass http://searchfix_up;
        error_page 502 504 = @emby_direct;
    }

    location @emby_direct {
        proxy_pass http://emby_up;
    }

    # A variable log path makes nginx check that `root` exists; every location proxies, so nothing is served from it.
    root /usr/share/nginx/html;
    access_log /var/log/emby-requests/req-$reqlog_date.log emby_req if=$reqlog_on;
    open_log_file_cache max=4 inactive=1m valid=1m;
}
